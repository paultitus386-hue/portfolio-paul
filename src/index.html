<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #monitor-videos {
      pointer-events: none;
      position: 'absolute';
      opacity: 0;
      width: 0;
      height: 0;
      top: 0;
      left: 0;

    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }

    video {
      position: absolute;
      top: 0;
      pointer-events: none;
    }
  </style>

  <!-- Primary Meta Tags -->
  <!-- After deploying, update og:url / og:image and twitter:image to the absolute URLs of your site -->
  <title>Paul Titus | Web Developer &amp; BCA Student</title>
  <meta name="title" content="Paul Titus | Web Developer &amp; BCA Student">
  <meta name="author" content="Paul Titus.P">
  <meta name="description"
    content="Explore the portfolio of Paul Titus, a BCA student and AI-assisted web developer building and deploying independent web applications.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Paul Titus | Web Developer &amp; BCA Student">
  <meta property="og:description"
    content="Explore the portfolio of Paul Titus, a BCA student and AI-assisted web developer building and deploying independent web applications.">
  <meta property="og:image" content="../static/images/og-paul-titus.jpg">
  <meta property="og:image:secure" content="../static/images/og-paul-titus.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Paul Titus | Web Developer &amp; BCA Student">
  <meta name="twitter:title" content="Paul Titus | Web Developer &amp; BCA Student">
  <meta property="twitter:description"
    content="Explore the portfolio of Paul Titus, a BCA student and AI-assisted web developer building and deploying independent web applications.">
  <meta name="twitter:description"
    content="Explore the portfolio of Paul Titus, a BCA student and AI-assisted web developer building and deploying independent web applications.">
  <meta property="twitter:image" content="../static/images/og-paul-titus.jpg">
  <meta name="twitter:image" content="../static/images/og-paul-titus.jpg">

  <!-- Images -->
  <link rel="shortcut icon" href="../static/images/favicon.ico" type="image/x-icon">
</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
  <div id="monitor-videos">
    <video id="video-1" muted loop autoplay width="0" height="0" src="../static/textures/monitor/video/base-static.mp4"
      style="opacity: 0;"></video>
    <video id="video-2" muted loop autoplay width="0" height="0"
      src="../static/textures/monitor/video/static-texture-layer.mp4" style="opacity: 0;"></video>
  </div>
</body>

</html>
